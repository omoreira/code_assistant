[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-assistant"
version = "0.1.0"
description = "Local Coding Assistant with code generation, debugging, and patching capabilities"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Olga Moreira", email = "olga.moreira@gmail.com"}
]
keywords = ["code-generation", "debugging", "patching", "ai", "assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "pylint>=2.13",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/omoreira/code_assistant"
Documentation = "https://github.com/omoreira/code_assistant/tree/main/docs"
Repository = "https://github.com/omoreira/code_assistant.git"
Issues = "https://github.com/omoreira/code_assistant/issues"

[project.scripts]
code-assistant = "code_starter.starterfile_creator:main"
assistant-ui-builder = "ui_builder.ui_builder:main"
assistant-repo-documenter = "repo_documenter.repo_documenter:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["code_starter*", "code_converter*", "code_debugger*", "code_patcher*", "code_refractor*", "ui_builder*", "repo_documenter*", "shared*", "tools*", "db_master_handler*", "assistant_contracts*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pylint.messages_control]
disable = [
    "C0330", "C0326",
]

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
