# Default configuration for code-assistant
# All modules inherit these defaults and can override specific values

project:
  name: code-assistant
  version: 0.1.0
  description: "Local Coding Assistant with code generation, debugging, and patching capabilities"
  author: "Olga Moreira"
  author_email: "olga.moreira@gmail.com"
  repository: "https://github.com/omoreira/code_assistant"

modules:
  enabled:
    - code_starter
    - code_analyzer
  
  code_starter:
    description: "Interactive project creation and code generation"
    enabled: true
  
  code_analyzer:
    description: "Code analysis and debugging utilities"
    enabled: true

llm:
  provider: "ollama"
  model: "deepseek-coder:6.7b"
  models:
    analysis: "qwen3:14b"
    reasoning: "deepseek-r1:14b"
    generation: "deepseek-coder:6.7b"
  api_endpoint: "http://localhost:11434"
  timeout: 600
  temperature: 0.7
  max_tokens: 2048
  # Provider registry. Add or edit entries to point a fork at any local Ollama
  # server or any API vendor. `api_key_env` names the LOCAL environment variable
  # that holds the credential -- secrets are never stored in this file.
  providers:
    ollama:
      base_url: "http://localhost:11434"
      api_key_env: ""
    openai:
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"
    anthropic:
      base_url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
    huggingface:
      base_url: "https://api-inference.huggingface.co"
      api_key_env: "HUGGINGFACE_API_KEY"
  # Optional: pin a specific role to a specific provider (model still comes
  # from `models` above). Uncomment and edit to mix local + API per role.
  # roles:
  #   analysis:  { provider: "ollama" }
  #   reasoning: { provider: "openai" }

paths:
  output_dir: "./generated_projects"
  config_dir: "./config"
  docs_dir: "./docs"
  tests_dir: "./tests"
  shared_dir: "./shared"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "code_assistant.log"

features:
  syntax_highlighting: true
  color_output: true
  interactive_mode: true
  progress_bars: true

development:
  debug: false
  verbose: false
  test_mode: false
